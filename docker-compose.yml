networks:
  ragmine_network:
    driver: bridge   
volumes:
  redis_data:
  postgres_data:

services:

  # ───────────────────────────────────────────
  #   REDIS
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ragmine_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ragmine_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────
  #   Postgres
  # ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:                          
      - ragmine_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5



  # ───────────────────────────────────────────
  #   MCP SERVER
  # ───────────────────────────────────────────
  mcp_server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragmine_mcp_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
      - .env.mcp_server
    environment:
      - SERVICE_NAME=mcp_server
      - REDMINE_SSL_CERT_PATH=${REDMINE_SSL_CERT_PATH}
    command: >
      uvicorn backend.mcp_server.main:app
      --host 0.0.0.0
      --port 8001
    networks:
      - ragmine_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────
  #   RAG SERVICE
  # ───────────────────────────────────────────
  rag_service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragmine_rag_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    #mem_limit: 80g
    #memswap_limit: 80g
    #cpus: '4.0'
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
      - .env.rag_service  
    environment:
      - SERVICE_NAME=rag_service
      - REDMINE_SSL_CERT_PATH=${REDMINE_SSL_CERT_PATH}
      - RD_SSL_CERT_PATH=${RD_SSL_CERT_PATH}
    command: >
      uvicorn backend.rag_service.main:app
      --host 0.0.0.0
      --port 8002
    networks:
      - ragmine_network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────
  #   ORCHESTRATOR
  # ───────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragmine_orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
      - .env.orchestrator  
    environment:
      - SERVICE_NAME=orchestrator
      - MCP_SERVER_HOST=mcp_server
      - MCP_SERVER_PORT=8001
      - RAG_SERVICE_HOST=rag_service
      - RAG_SERVICE_PORT=8002
      - REDIS_HOST=redis
      - REDMINE_SSL_CERT_PATH=${REDMINE_SSL_CERT_PATH}
      - SCALEWAY_SSL_CERT_PATH=${SCALEWAY_SSL_CERT_PATH}
      - RD_SSL_CERT_PATH=${RD_SSL_CERT_PATH}
    command: >
      uvicorn backend.orchestrator.main:app
      --host 0.0.0.0
      --port 8000
      --timeout-keep-alive 300
    networks:
      - ragmine_network
    depends_on:
      mcp_server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3